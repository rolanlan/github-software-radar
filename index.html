<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GitHub 中文软件雷达：免费的开源软件发现与筛选"><title>软件雷达 · 发现值得关注的开源工具</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#182233;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}a{color:#1766ca}header{background:#fff;border-bottom:1px solid #e7eaf0;padding:18px 5%}nav{max-width:1160px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}nav strong{font-size:20px}nav a{font-size:14px}main{max-width:1160px;padding:30px 18px 60px;margin:auto}.hero{background:#142943;color:white;padding:35px;border-radius:17px}.hero h1{margin:0 0 10px;font-size:clamp(24px,4vw,37px)}.hero p{margin:0;color:#d9e4f3;line-height:1.8}.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:24px;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0 10px}input,select{background:white;border:1px solid #d5dce8;border-radius:10px;padding:12px;font:inherit}input{flex:1;min-width:210px}select{min-width:155px}.notes{font-size:13px;color:#607085;margin-bottom:18px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:11px;min-width:0}.card h2{font-size:18px;overflow-wrap:anywhere;margin:0}.pill{background:#eaf2ff;color:#25568d;border-radius:30px;padding:5px 10px;display:inline-block;font-size:12px;width:max-content;max-width:100%}.card p{margin:0;line-height:1.7;font-size:14px;color:#435167;overflow-wrap:anywhere}.meta{font-size:12px;color:#65758c;line-height:1.8}.card a{margin-top:auto;font-size:14px;font-weight:650}.empty{padding:35px;text-align:center;color:#5b6a7d}.footer{font-size:12px;color:#6d7787;text-align:center;margin-top:45px}@media(max-width:500px){header{padding:16px}main{padding:18px 12px}.hero{padding:24px}.stats{gap:12px}.toolbar>*{width:100%}}
</style></head><body>
<header><nav><strong>◎ 软件雷达 <span style="font-size:12px;color:#64748b">BETA</span></strong><a href="https://github.com/rolanlan/github-software-radar" target="_blank" rel="noopener noreferrer">GitHub 仓库 ↗</a></nav></header>
<main><section class="hero"><h1>看懂真正有用的开源软件</h1><p>每周二、周五自动扫描 GitHub，帮你用中文分类找到 AI、开发、商业管理与平台技术工具。无需懂编程也能快速浏览。</p><div class="stats"><span id="count">正在加载项目…</span><span id="updated"></span><span>免费公开目录 · 无需注册</span></div></section>
<section aria-label="项目筛选" class="toolbar"><input id="search" type="search" aria-label="搜索项目" placeholder="搜索软件名、功能或类别…"><select id="edition" aria-label="选择历史期数"><option value="latest">最新一期</option></select><select id="category" aria-label="选择分类"><option value="">全部类别</option></select><select id="sort" aria-label="排序"><option value="stars">按关注数量</option><option value="updated">按最近更新</option><option value="name">按名称</option></select></section>
<div class="notes">中文内容是依据公开项目简介整理的<strong>初步用途说明</strong>，不是自动 AI 翻译，也未经安装测试、安全或许可证审计。新项目如尚无中文解读会标记待更新。Star 不是质量保证。</div>
<div id="projects" class="grid" aria-live="polite"><div class="empty">正在读取 GitHub 数据…</div></div>
<div class="footer">数据来自 GitHub 公开项目信息。项目版权及许可证归各自作者所有。<a href="https://github.com/rolanlan/github-software-radar/blob/main/reports/latest.md">原始报告</a></div></main>
<script>
"use strict";
let all=[];let reviews={};
const el=id=>document.getElementById(id);
function elem(tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=String(text);return e;}
function render(){
const q=el("search").value.trim().toLocaleLowerCase(),c=el("category").value,s=el("sort").value;
const data=all.filter(p=>(!c||p.category===c)&&[p.name,p.category,p.description_original,p.language,reviews[p.name]?.summary_zh,reviews[p.name]?.use_case_zh].join(" ").toLocaleLowerCase().includes(q));
data.sort((a,b)=>s==="updated"?String(b.updated_at||"").localeCompare(String(a.updated_at||"")):s==="name"?a.name.localeCompare(b.name):(b.stars||0)-(a.stars||0));
const grid=el("projects");grid.replaceChildren();el("count").textContent="当前展示 "+data.length+" / "+all.length+" 个项目";
if(!data.length){grid.append(elem("div","empty","没有匹配的软件，请调整搜索条件。"));return;}
for(const p of data){const card=elem("article","card"),pill=elem("span","pill",p.category||"未分类"),h=elem("h2","",p.name),desc=elem("p","",p.description_original||"暂无原始简介"),meta=elem("div","meta","★ "+Number(p.stars||0).toLocaleString("zh-CN")+"  ·  "+(p.language||"未知语言")+"  ·  许可证："+(p.license||"未确认")+"\n最后提交："+(p.updated_at?String(p.updated_at).slice(0,10):"未知")),link=elem("a","","查看原项目 ↗");meta.style.whiteSpace="pre-line";if(/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/?$/.test(p.url)){link.href=p.url;link.target="_blank";link.rel="noopener noreferrer";}else{link.textContent="链接待核实";link.removeAttribute("href");}
const review=reviews[p.name];if(review){const zh=elem("p","",review.summary_zh);zh.style.fontWeight="650";const use=elem("p","","实际用途："+review.use_case_zh);const fit=elem("div","meta","使用门槛："+review.difficulty_zh+"\n适用方向："+review.application_zh+"\n建议："+review.recommendation+"（仅初步判断）");fit.style.whiteSpace="pre-line";card.append(pill,h,zh,use,fit,meta,link);}else{const pending=elem("p","","中文解读待更新；下方为项目作者提供的原始简介。");pending.style.color="#90620b";card.append(pill,h,pending,desc,meta,link);}grid.append(card);}
}
async function load(){try{const edition=el("edition").value;const source=edition==="latest"?"./reports/latest.json":"./reports/archive/"+edition+".json";const resp=await fetch(source,{cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);const data=await resp.json();try{const reviewResp=await fetch("./data/chinese-reviews.json",{cache:"no-store"});if(reviewResp.ok){const reviewData=await reviewResp.json();reviews=reviewData.projects||{};}}catch(e){console.warn("Chinese descriptions unavailable",e);}if(!Array.isArray(data.projects))throw Error("invalid report");all=data.projects;el("category").replaceChildren(new Option("全部类别",""));const categories=[...new Set(all.map(p=>p.category).filter(Boolean))].sort();for(const c of categories){const opt=elem("option","",c);opt.value=c;el("category").append(opt);}el("updated").textContent="采集日期："+String(data.generated_at||"").slice(0,10);render();}catch(e){el("count").textContent="读取失败";el("projects").replaceChildren(elem("div","empty","数据暂时无法加载，请稍后刷新。也可点击底部“原始报告”查看。"));console.error(e);}}
async function loadHistory(){try{const resp=await fetch("./reports/history.json",{cache:"no-store"});if(!resp.ok)throw Error("history unavailable");const data=await resp.json();for(const date of data.dates||[]){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;const opt=elem("option","",date+" 历史报告");opt.value=date;el("edition").append(opt);}}catch(e){console.warn("history unavailable",e);}}
el("edition").addEventListener("change",load);
for(const id of ["search","category","sort"])el(id).addEventListener(id==="search"?"input":"change",render);
loadHistory();load();
</script></body></html>
