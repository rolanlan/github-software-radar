name: Twice Weekly Software Radar

on:
  workflow_dispatch:
  schedule:
    # Tuesday and Friday at 06:00 UTC = 08:00 Africa/Lusaka (UTC+2)
    - cron: "0 6 * * 2,5"

permissions:
  contents: write

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar.py
      - name: Save generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "data: archive twice-weekly software radar"
            git push
          fi
